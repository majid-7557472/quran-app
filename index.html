<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قرآن مجید - تلاوت</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css">
    <style>
        .ayah-text { font-family: 'Scheherazade New', 'Amiri', serif; }
        .loading { text-align: center; font-size: 1.2rem; margin: 20px 0; color: #d4af37; }
        .surah-details { display: flex; justify-content: center; gap: 15px; margin-top: 8px; font-size: 0.95rem; opacity: 0.9; }
    </style>
</head>
<body>

    <header>
        <h1>📖 قرآن مجید کی تلاوت</h1>
        <p class="subtitle">سورت منتخب کریں اور ہر آیت سنیں</p>
    </header>

    <main>
        <div class="surah-form">
            <select id="surahSelect" onchange="onSurahChange()">
                <option value="">-- سورت منتخب کریں (لوڈ ہو رہا ہے...) --</option>
            </select>
        </div>

        <div id="loadingIndicator" class="loading" style="display:none;">
            ⏳ لوڈ کیا جا رہا ہے، براہ کرم انتظار کریں...
        </div>

        <div id="surahContainer" style="display:none;">
            <section class="surah-info">
                <h2 id="surahTitle"></h2>
                <p id="surahSubTitle"></p>
                <div class="surah-details">
                    <span id="surahAyahsCount"></span>
                    <span>|</span>
                    <span id="surahRevelation"></span>
                </div>
            </section>

            <div class="full-audio">
                <h3>🔊 پوری سورت سنیں</h3>
                <audio id="fullAudioPlayer" controls style="width:100%">
                    <source id="fullAudioSource" src="" type="audio/mpeg">
                    آپ کا براؤزر آڈیو سپورٹ نہیں کرتا
                </audio>
            </div>

            <div class="ayah-list" id="ayahList"></div>
        </div>

        <p class="hint" id="defaultHint">تلاوت سننے کے لیے اوپر سے کوئی سورت منتخب کریں</p>
    </main>

    <footer>
        <p>Powered by alquran.cloud API &amp; Sheikh Mishary Rashid Alafasy</p>
    </footer>

    <script>
        const BASE_URL = "https://api.alquran.cloud/v1";
        const RECITER = "ar.alafasy";
        const surahSelect = document.getElementById("surahSelect");
        const loadingIndicator = document.getElementById("loadingIndicator");
        const surahContainer = document.getElementById("surahContainer");
        const defaultHint = document.getElementById("defaultHint");

        async function loadSurahList() {
            try {
                const data = await fetch(`${BASE_URL}/surah`).then(r => r.json());
                surahSelect.innerHTML = '<option value="">-- سورت منتخب کریں --</option>';
                data.data.forEach(s => {
                    const opt = document.createElement("option");
                    opt.value = s.number;
                    opt.textContent = `${s.number}. ${s.name} (${s.englishName})`;
                    surahSelect.appendChild(opt);
                });

                const surahParam = new URLSearchParams(window.location.search).get('surah');
                if (surahParam) {
                    surahSelect.value = surahParam;
                    fetchSurahData(surahParam);
                }
            } catch (err) {
                surahSelect.innerHTML = '<option value="">لسٹ لوڈ کرنے میں مسئلہ ہوا، پیج ریفریش کریں</option>';
            }
        }

        function onSurahChange() {
            const num = surahSelect.value;
            if (!num) {
                surahContainer.style.display = "none";
                defaultHint.style.display = "block";
                return;
            }
            fetchSurahData(num);
        }

        async function fetchSurahData(surahNumber) {
            loadingIndicator.style.display = "block";
            surahContainer.style.display = "none";
            defaultHint.style.display = "none";
            try {
                const data = await fetch(`${BASE_URL}/surah/${surahNumber}/${RECITER}`).then(r => r.json());
                renderSurah(data.data);
            } catch (err) {
                alert("سورت کا ڈیٹا حاصل کرنے میں مسئلہ ہوا۔ براہ کرم انٹرنیٹ کنکشن چیک کریں۔");
            } finally {
                loadingIndicator.style.display = "none";
            }
        }

        function renderSurah(surah) {
            document.getElementById("surahTitle").textContent = surah.name;
            document.getElementById("surahSubTitle").textContent = `${surah.englishName} — ${surah.englishNameTranslation}`;
            document.getElementById("surahAyahsCount").textContent = `کل آیات: ${surah.numberOfAyahs}`;
            document.getElementById("surahRevelation").textContent = `نزول: ${surah.revelationType === 'Meccan' ? 'مکی' : 'مدنی'}`;

            const fullSource = document.getElementById("fullAudioSource");
            fullSource.src = `https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/${surah.number}.mp3`;
            document.getElementById("fullAudioPlayer").load();

            const ayahList = document.getElementById("ayahList");
            ayahList.innerHTML = "";
            surah.ayahs.forEach(ayah => {
                const card = document.createElement("div");
                card.className = "ayah-card";
                card.innerHTML = `
                    <div class="ayah-number">آیت ${ayah.numberInSurah}</div>
                    <p class="ayah-text">${ayah.text}</p>
                    <audio controls preload="none">
                        <source src="${ayah.audio}" type="audio/mpeg">
                        آپ کا براؤزر آڈیو سپورٹ نہیں کرتا
                    </audio>
                `;
                ayahList.appendChild(card);
            });

            surahContainer.style.display = "block";
        }

        window.addEventListener("DOMContentLoaded", loadSurahList);
    </script>
</body>
</html>
